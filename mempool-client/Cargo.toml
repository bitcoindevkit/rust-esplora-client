[package]
name = "mempool-client"
version = "0.1.0"
edition = "2021"
authors = ["Bitcoin Dev Kit Developers"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/bitcoindevkit/rust-esplora-client"
repository = "https://github.com/bitcoindevkit/rust-esplora-client"
documentation = "https://docs.rs/mempool-client/"
description = "Client for mempool.space API, built on esplora-client"
keywords = ["bitcoin", "mempool", "mempool.space", "esplora"]
readme = "README.md"
rust-version = "1.75.0"

[lib]
name = "mempool_client"
path = "src/lib.rs"

[dependencies]
esplora-client = { path = "../esplora-client", version = "0.13" }
mempool-types = { path = "../mempool-types", version = "0.1" }

[features]
default = ["blocking", "blocking-https", "async", "async-https", "tokio"]

tokio = ["esplora-client/tokio"]
async = ["esplora-client/async"]
async-https = ["async", "esplora-client/async-https"]
async-https-native = ["async", "esplora-client/async-https-native"]
async-https-rustls = ["async", "esplora-client/async-https-rustls"]
async-https-rustls-probe = ["async", "esplora-client/async-https-rustls-probe"]

blocking = ["esplora-client/blocking"]
blocking-https = ["blocking", "esplora-client/blocking-https"]
blocking-https-native = ["blocking", "esplora-client/blocking-https-native"]
blocking-https-rustls = ["blocking", "esplora-client/blocking-https-rustls"]
blocking-https-rustls-probe = ["blocking", "esplora-client/blocking-https-rustls-probe"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.rbmt.lint]
allowed_duplicates = [
    "getrandom",
    "syn",
    "windows-sys",
    "wit-bindgen",
]

[package.metadata.rbmt.test]
# Don't test these features in isolation
exclude_features = [
    "tokio",
    "async-https",
    "async-https-native",
    "async-https-rustls",
    "async-https-rustls-probe",
    "blocking-https",
    "blocking-https-native",
    "blocking-https-rustls",
    "blocking-https-rustls-probe",
]
# Run tests using these exact feature sets
exact_features = [
    ["async", "blocking"],
    ["async-https", "blocking-https", "tokio"],
    ["async-https-native", "blocking-https-native", "tokio"],
    ["async-https-rustls", "blocking-https-rustls", "tokio"],
    ["async-https-rustls-probe", "blocking-https-rustls-probe", "tokio"],
]
